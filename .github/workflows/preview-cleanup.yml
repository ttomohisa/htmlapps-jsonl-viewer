# Always check out trusted main; never run PR code with Cloudflare secrets.
name: Cleanup PR preview
'on':
  pull_request:
    branches:
    - main
    types:
    - closed
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Closed PR number to clean up'
        required: true
        type: number
permissions:
  contents: read
concurrency:
  group: cloudflare-pr-preview-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  cleanup:
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout trusted main branch
      uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      with:
        ref: ${{ github.event.repository.default_branch }}
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
      with:
        node-version: 24
    - name: Install trusted cleanup tool outside PR workspace
      run: |
        mkdir -p "$RUNNER_TEMP/preview-control"
        cd "$RUNNER_TEMP/preview-control"
        npm install --prefix . --ignore-scripts --no-audit --no-fund --package-lock=false wrangler@4.135.0
    - name: Delete preview using trusted configuration
      run: node .github/scripts/preview-command.cjs delete
      env:
        CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        PREVIEW_NAME: r${{ github.event.repository.id }}-pr-${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
