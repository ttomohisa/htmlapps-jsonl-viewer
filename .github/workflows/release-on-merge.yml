# Publish only on trusted main changes (normally a human-merged PR).
# A main-only manual run is an idempotent recovery path.
# Build/test runs read-only; tag and Release publishing is isolated.
name: Release on main

'on':
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jsonl-viewer-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      publish: ${{ steps.metadata.outputs.publish }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - name: Checkout trusted main commit (read-only)
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24
      - name: Validate version and check existing release
        id: metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = [string](Get-Content -Raw -Encoding UTF8 app.config.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw "Expected a stable SemVer version: $version" }
          $tag = "v$version"
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          # Listing succeeds even when this version has not been published yet.
          # Avoid treating an expected 404 from 'gh release view' as a PowerShell native-command error.
          $releaseJson = gh release list --json tagName --limit 1000
          if ($LASTEXITCODE -ne 0) { throw "Unable to check existing GitHub Releases." }
          $publishedTags = @($releaseJson | ConvertFrom-Json | ForEach-Object { $_.tagName })
          if ($publishedTags -contains $tag) {
            Write-Host "GitHub Release $tag already exists; skipping."
            "publish=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit 0
          }
          "publish=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and verify all standalone variants
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        run: |
          ./scripts/check-repository.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Repository verification failed.' }
          node --test tests/mobile-help-version.test.cjs tests/ui-copy.test.cjs
          if ($LASTEXITCODE -ne 0) { throw 'UI copy regression failed.' }
      - name: Assemble release artifacts and checksums
        if: steps.metadata.outputs.publish == 'true'
        shell: pwsh
        run: ./scripts/prepare-release-assets.ps1
      - name: Upload verified release package
        if: steps.metadata.outputs.publish == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verified-jsonl-release
          path: release-assets/
          if-no-files-found: error
          retention-days: 14

  release:
    needs: package
    if: needs.package.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout published main revision for tag creation
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Download verified release package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: verified-jsonl-release
          path: release-assets
      - name: Create immutable version tag and GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.package.outputs.tag }}
          MERGE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          sha="$MERGE_SHA"
          prefix="htmlapps-jsonl-viewer-$tag"

          # Never tag a revision that is not in the protected main history.
          git fetch origin main --tags
          git merge-base --is-ancestor "$sha" origin/main

          current="$(git rev-parse -q --verify "refs/tags/$tag^{commit}" 2>/dev/null || true)"
          if [[ -n "$current" && "$current" != "$sha" ]]; then
            echo "::error::Tag $tag already exists at $current (expected $sha)."
            exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to publish."
            exit 0
          fi
          if [[ -z "$current" ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$tag" "$sha" -m "JSONL Viewer $tag"
            git push origin "refs/tags/$tag"
          fi
          gh release create "$tag" \
            "release-assets/$prefix.html" \
            "release-assets/$prefix.self-extract.html" \
            "release-assets/$prefix.zip" \
            "release-assets/SHA256SUMS.txt" \
            --verify-tag --title "JSONL Viewer $tag" \
            --notes-file release-assets/RELEASE_NOTES.md --latest
